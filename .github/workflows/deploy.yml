name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          NODE_ENV: production

      - name: Prepare dist folder
        run: |
          # Ensure dist exists
          if [ ! -d "dist" ]; then
            echo "Error: dist folder not created by build!"
            exit 1
          fi
          
          # Copy API data to dist
          if [ -d "public/api" ]; then
            mkdir -p dist/api
            cp -r public/api/* dist/api/
          fi
          
          # Copy other public assets if they exist
          if [ -d "public" ]; then
            cp -r public/* dist/ 2>/dev/null || true
          fi
          
          # Create .nojekyll to disable Jekyll processing
          touch dist/.nojekyll
          
          # List what's in dist
          echo "Contents of dist folder:"
          ls -la dist/
          
          # Verify .nojekyll exists
          if [ -f "dist/.nojekyll" ]; then
            echo "✅ .nojekyll file exists in dist/"
          else
            echo "❌ .nojekyll file MISSING from dist/"
            exit 1
          fi
          
          # List all files that will be uploaded
          echo ""
          echo "All files in dist/ (including hidden):"
          find dist -type f | head -20
          
          # Verify index.html has correct build output (not dev source)
          echo ""
          echo "Verifying dist/index.html..."
          if grep -q "src/main.tsx" dist/index.html; then
            echo "❌ ERROR: dist/index.html contains dev source path!"
            cat dist/index.html
            exit 1
          fi
          if grep -q "/assets/index-" dist/index.html; then
            echo "✅ dist/index.html is correct (has built assets)"
          else
            echo "❌ ERROR: dist/index.html doesn't contain built asset paths!"
            cat dist/index.html
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
